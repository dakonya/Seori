name: DetectionCI software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Python ${{ matrix.python }} offline validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and controlled transport tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q detectionci tests lab
      - name: Validate scenarios and declared fixture outcomes
        run: |
          python -m detectionci validate
          python -m detectionci --scenarios fixtures/fault-scenarios validate
          python -m detectionci verify-fixtures
      - name: Run default synthetic fixture suite
        run: python -m detectionci suite --mode fixture --output artifacts/fixture-suite

# This workflow never runs SSH actions or receives Wazuh credentials.
# Live checks require a separate trusted environment and explicit operator setup.
